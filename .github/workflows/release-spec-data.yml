name: Prepare a sim data release

# Fires only when the automatic data pull request is merged, identified by the
# label the update workflow puts on it.
#
# It deliberately does NOT trigger on "SpecPriority.lua changed on main": that
# file is edited during ordinary development too, and a normal release commit
# would then tag a patch release on top of itself.
#
# A data refresh is a patch release: v1.3 -> v1.3.1 -> v1.3.2. Deliberately not
# a commit hash or a calendar week, because CurseForge and the packager take the
# version from the tag and neither of those sorts against a patch number.
#
# The tag is NOT created here, on purpose. Events raised with the GITHUB_TOKEN
# do not start further workflows -- GitHub's guard against recursion -- so a tag
# pushed from here would sit there without ever reaching release.yml, and
# nothing would be uploaded. A tag that looks like a release but is not is worse
# than no tag at all, so the last step stays in human hands.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Merged, not just closed, and carrying the label the data pull request gets.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'spec-data'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet lupa

      # Belt and braces: the data pull request already ran this, but a hand
      # edit to SpecPriority.lua would land here too.
      - name: Validate the data
        run: python3 tools/check_spec_priority.py --file SpecPriority.lua

      - name: Bump the patch version
        id: bump
        run: |
          DATE=$(sed -n 's/^ns\.SPEC_PRIORITY_UPDATED = "\(.*\)"$/\1/p' SpecPriority.lua)
          if [ -z "$DATE" ]; then
            echo "::error::No SPEC_PRIORITY_UPDATED found in SpecPriority.lua"
            exit 1
          fi
          VERSION=$(python3 tools/bump_patch_version.py --date "$DATE" | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION with data from $DATE"

      - name: Commit the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PriestAssist.toc CHANGELOG.md
          git commit -m "Prepare v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Say what is left to do
        run: |
          VERSION="v${{ steps.bump.outputs.version }}"
          {
            echo "### $VERSION is ready to tag"
            echo
            echo "The version and changelog are committed. Pushing the tag from your own"
            echo "machine is what starts the packaging and the CurseForge upload -- a tag"
            echo "pushed from Actions would not, because of GitHub's recursion guard."
            echo
            echo '```'
            echo "git pull"
            echo "git tag -a $VERSION -m 'Power Infusion sim data update'"
            echo "git push origin $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
